name: UniConnect CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore UniConnectHub.sln
      - run: dotnet build UniConnectHub.sln --no-restore --configuration Release
      - run: dotnet test UniConnectHub.sln --no-build --configuration Release
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/UniConnect.Api/UniConnect.Api.csproj --no-build --configuration Release --output ./publish
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: uniconnect-api
          path: ./publish

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/react-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/react-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
